name: Windows build

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Publish the build as a release with this tag (for example v0.1.0-test.2). Leave empty to only build.'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.8
          cache: true

      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - run: flutter build windows --release

      - name: Zip the app
        shell: pwsh
        run: Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath StackSpace-windows.zip

      - uses: actions/upload-artifact@v4
        with:
          name: StackSpace-windows
          path: StackSpace-windows.zip

      - name: Publish a release (version tags, or a tag given when run by hand)
        if: startsWith(github.ref, 'refs/tags/v') || inputs.release_tag != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag || github.ref_name }}
          target_commitish: ${{ github.sha }}
          files: StackSpace-windows.zip
          prerelease: ${{ contains(inputs.release_tag || github.ref_name, '-') }}
          generate_release_notes: true
